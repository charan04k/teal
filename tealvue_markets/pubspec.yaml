name: tealvue_markets
description: Crest - Real-Time Market Watchlist & Portfolio App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.2
  socket_io_client: ^2.0.3+1

  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Charts
  fl_chart: ^0.65.0

  # DI
  get_it: ^7.6.4

  # Navigation
  go_router: ^13.0.0

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  intl: ^0.18.1

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/